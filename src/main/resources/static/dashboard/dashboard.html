<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMS - Dashboard</title>
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
    <div class="dashboard-container">
        <header class="dashboard-header">
            <h1>Smart Inventory Management System</h1>
            <button id="logoutBtn" class="btn-secondary">Logout</button>
        </header>
        
        <nav class="dashboard-nav">
            <ul>
                <li><a href="#" class="active">Dashboard</a></li>
                <li><a href="../inventory/list.html">Inventory</a></li>
                <li><a href="../reports/reports.html">Reports</a></li>
            </ul>
        </nav>
        
        <main class="dashboard-content">
            <div class="stats-container">
                <div class="stat-card">
                    <h3>Total Items</h3>
                    <p id="totalItems">0</p>
                </div>
                <div class="stat-card">
                    <h3>Low Stock Items</h3>
                    <p id="lowStockItems">0</p>
                </div>
                <div class="stat-card">
                    <h3>Expiring Soon Items</h3>
                    <p id="expiringSoonItems">0</p>
                </div>
            </div>
            
            <div class="recent-activity">
                <h2>Recent Activity</h2>
                    <!-- Activity items will be added here by JS -->
                    <table id="activityList">
                        <thead>
                        <tr>
                            <th>Action</th>
                            <th>Description</th>
                            <th>User</th>
                            <th>Date</th>
                        </tr>
                        </thead>
                        <tbody>
                        <!-- Stock movements will be added here by JS -->
                        </tbody>
                    </table>
            </div>

<!--            To show the stock movements -->
            <!-- Add this section below the recent-activity div -->
            <div class="stock-movements" id="stockMovementsSection">
                <h2>Recent Stock Movements</h2>
                <table id="stockMovementsTable">
                    <thead>
                    <tr>
                        <th>Date</th>
                        <th>Item</th>
                        <th>Action</th>
                        <th>Quantity</th>
                        <th>User</th>
                    </tr>
                    </thead>
                    <tbody>
                    <!-- Stock movements will be added here by JS -->
                    </tbody>
                </table>
            </div>

        </main>
    </div>
    
    <script src="../auth/auth.js"></script>
     <script src="dashboard.js"></script>
</body>
</html>
