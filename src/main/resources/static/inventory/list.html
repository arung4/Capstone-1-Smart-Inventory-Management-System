<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMS - Inventory</title>
    <link rel="stylesheet" href="../css/list.css">
</head>
<body>
    <div class="inventory-container">
        <header class="inventory-header">
            <h1>Inventory Management</h1>
            <nav>
                <a href="../dashboard/dashboard.html">Dashboard</a>
                <a href="../reports/reports.html">Reports</a>
                <button id="logoutBtn" class="btn-secondary">Logout</button>
            </nav>
        </header>
        
        <div class="inventory-actions">
            <button id="addItemBtn" class="btn-primary">Add New Item</button>
            <input type="text" id="searchInput" placeholder="Search inventory...">
        </div>
        
        <table class="inventory-table">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Expiry Date</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="inventoryTableBody">
                <!-- Inventory items will be added here by JS -->
            </tbody>
        </table>
    </div>
    
    <script src="../auth/auth.js"></script>
    <script src="list.js"></script>
</body>
</html>
