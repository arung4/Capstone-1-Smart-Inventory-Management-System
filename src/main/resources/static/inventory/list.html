<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMS - Inventory</title>
    <link rel="stylesheet" href="../css/list.css">
</head>
<body>
    <div class="inventory-container">
        <header class="dashboard-header">
            <h1>Smart Inventory Management System</h1>
            <button id="logoutBtn" class="btn-secondary">Logout</button>
        </header>

        <nav class="dashboard-nav">
            <ul>
                <li><a href="../dashboard/dashboard.html">Dashboard</a></li>
                <li><a href="#" class="active">Inventory</a></li>
                <li><a href="../reports/reports.html">Reports</a></li>
            </ul>
        </nav>
        <div class = "inventory-container">
            <div class="inventory-actions">
                <button id="addItemBtn" class="btn-primary">Add New Item</button>
                <input type="text" id="searchInput" placeholder="Search inventory...">
            </div>

            <table class="inventory-table">
                <thead>
                <tr>
                    <th>Name</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Expiry Date</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody id="inventoryTableBody">
                <!-- Inventory items will be added here by JS -->
                </tbody>
            </table>
        </div>
    </div>
    <script src="../auth/auth.js"></script>
    <script src="list.js"></script>
</body>
</html>
