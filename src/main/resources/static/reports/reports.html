<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMS - Reports</title>
    <link rel="stylesheet" href="../css/reports.css">
</head>
<body>
<div class="reports-container">
    <header class="dashboard-header">
        <h1>Smart Inventory Management System</h1>
        <button id="logoutBtn" class="btn-secondary">Logout</button>
    </header>

    <nav class="dashboard-nav">
        <ul>
            <li><a href="../dashboard/dashboard.html">Dashboard</a></li>
            <li><a href="../inventory/list.html" >Inventory</a></li>
            <li><a href="#" class="active">Reports</a></li>
        </ul>
    </nav>

    <div class = "report-content">

        <div class="report-controls">
            <div class="report-type">
                <label>
                    <input type="radio" name="reportType" value="daily" checked> Daily Report
                </label>
                <label>
                    <input type="radio" name="reportType" value="weekly"> Weekly Report
                </label>
                <label>
                    <input type="radio" name="reportType" value="custom"> Custom Date Range
                </label>
            </div>

            <div class="date-range">
                <div id="customDateRange" style="display: none;">
                    <label for="startDate">From:</label>
                    <input type="date" id="startDate">

                    <label for="endDate">To:</label>
                    <input type="date" id="endDate">
                </div>

                <button id="generateReportBtn" class="btn-primary">Generate Report</button>
                <button id="exportReportBtn" class="btn-primary">Export to CSV</button>
            </div>
        </div>

        <div class="report-results">
            <table class="report-table">
                <thead>
                <tr>
                    <th>Date</th>
                    <th>Item Name</th>
                    <th>Movement Type</th>
                    <th>Quantity Change</th>
                    <th>Previous Quantity</th>
                    <th>New Quantity</th>
                    <th>User</th>
                    <th>Notes</th>
                </tr>
                </thead>
                <tbody id="reportTableBody">
                <!-- Report data will be added here by JS -->
                </tbody>
            </table>
        </div>

    </div>
</div>

<script src="reports.js"></script>
</body>
</html>
